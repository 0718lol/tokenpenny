name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      # data-only PRs (the monthly pricing refresh) are validated inside
      # update-prices.yml; a pull_request run here would just sit in
      # action_required because the PR author is github-actions[bot]
      - 'data/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
