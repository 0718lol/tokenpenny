name: Update pricing snapshot

on:
  schedule:
    - cron: '0 6 1 * *' # monthly, 1st at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.mjs
      - run: npm ci
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh LiteLLM pricing snapshot'
          title: 'chore: monthly pricing snapshot refresh'
          body: |
            Automated monthly refresh of `data/model-prices.json` from
            [LiteLLM's pricing database](https://github.com/BerriAI/litellm).
            The full test suite runs in this workflow against the refreshed
            snapshot before this PR is created — safe to merge when this
            workflow is green.
          branch: chore/pricing-refresh
          delete-branch: true
